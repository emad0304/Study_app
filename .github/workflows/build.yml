name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install SDKs
        run: |
          sudo apt-get update
          sudo apt-get install -y curl git unzip xz-utils zip libglu1-mesa

      - name: Install Flet
        run: pip install flet

      - name: Build APK
        run: |
          # دستور نهایی برای ساخت با ورژن جدید
          flet build apk --main study.py

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyApp-Final
          path: build/apk/*.apk
